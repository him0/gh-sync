name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cli/gh-extension-precompile@v2.2.0
        with:
          go_version_file: go.mod
          # Passed to `go build` as a single argument after the action's own
          # -ldflags="-s -w"; the last -ldflags wins, so -s -w is repeated here.
          go_build_options: -ldflags=-s -w -X main.version=${{ github.ref_name }}
